<html>

<head>
    <title> Haunted House </title>
    <link rel="icon" href="game/assets/hauntedhouse-logo.png" />
    <link href='game/styles/intro.css' rel="stylesheet">
    <link href="https://fonts.googleapis.com/css?family=Bangers" rel="stylesheet">
</head>

<body>
    <h1>Basement Door</h1>
    <hr>
    <p>Mystery is what the haunted seek, and the haunted house delivers!</p>
    <a id='door' href='#'>
        <img id='doorImage' onclick='OpenDoor()' src='game/assets/door.jpg' width="240">
    </a>
    <div id='textbox'></div>
    <br><iframe src='inventory.html' id=inventory height=100 width=200></iframe>
</body>
<script>
    var keys = +(localStorage.getItem("keys") || 0);
    var textbox = document.getElementById("textbox");
    var doorImage = document.getElementById("doorImage");
    var inventory = document.getElementById("inventory");
     // Load door state from localStorage
    var doorUnlocked = localStorage.getItem("doorUnlocked") === "true";

    // If previously unlocked, show door as open
    if (doorUnlocked) {
        doorImage.src = 'game/assets/door2.jpg';
        textbox.innerHTML = `
            <p><a href='ghost.html'>Enter</a> or <a href='Hauntedhouse.html'>Leave</a></p>`;
    }
    function OpenDoor() {
        if (doorImage.src.includes('door2.jpg')) {
            // Door is already unlocked
            textbox.innerHTML = `<a href='ghost.html'>Enter</a>`;
        }
        else if (keys > 0) {
            doorImage.src = 'game/assets/door2.jpg'
            textbox.innerHTML = `The door unlocked. but the key broke apart.<br>
            <a href ='ghost.html'>Enter</a>`
            keys --;
            localStorage.setItem("keys", keys);
            inventory.src = inventory.src;//updates inventory
            localStorage.setItem("doorUnlocked", true); // save state of the door
        }
        else {
            textbox.innerHTML = `The door is locked.Find the key.<br>
            <a href ='Hauntedhouse.html' >leave</a>`;
        }
    }
</script>
</html>
